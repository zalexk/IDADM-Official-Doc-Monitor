<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>官方文档更新监控</title>
<link rel="icon" href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='86'>📄</text></svg>">
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --border: #e4e8ef; --border-strong: #d3dae4;
    --text: #182131; --muted: #5c6a7e; --faint: #95a1b3;
    --ok: #159c52; --ok-soft: rgba(21, 156, 82, 0.12);
    --accent: #2f6bff; --accent-soft: rgba(47, 107, 255, 0.11);
    --error: #dc2f2f; --error-soft: rgba(220, 47, 47, 0.11);
    --chip: #eef2f7; --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b111f; --card: #141d30; --border: #26334c; --border-strong: #31405e;
      --text: #e7edf6; --muted: #9aa7ba; --faint: #66748c;
      --ok: #4ade80; --ok-soft: rgba(74, 222, 128, 0.13);
      --accent: #6aa0ff; --accent-soft: rgba(106, 160, 255, 0.14);
      --error: #f87171; --error-soft: rgba(248, 113, 113, 0.13);
      --chip: #1e2a44;
      --shadow: 0 1px 2px rgba(0,0,0,.35);
      --shadow-lg: 0 14px 40px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "PingFang SC", "PingFang TC", "Microsoft JhengHei", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 30px 22px 64px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ---------- header ---------- */
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
  .lang-switch {
    display: inline-flex; border: 1px solid var(--border); border-radius: 999px;
    overflow: hidden; background: var(--card); box-shadow: var(--shadow);
  }
  .lang-switch button {
    padding: 5px 14px; font-size: 12.5px; color: var(--muted); background: none;
    border: none; cursor: pointer; transition: background .15s, color .15s;
  }
  .lang-switch button + button { border-left: 1px solid var(--border); }
  .lang-switch button:hover { color: var(--text); }
  .lang-switch button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .refresh { color: var(--faint); font-size: 12px; min-height: 18px; }

  /* ---------- hero ---------- */
  .hero {
    margin: 24px 0 0; padding: 20px 22px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--border);
    border-left: 5px solid var(--ok); box-shadow: var(--shadow);
    display: flex; gap: 15px; align-items: flex-start;
  }
  .hero.changed { border-left-color: var(--accent); }
  .hero.error   { border-left-color: var(--error); }
  .hero .icon {
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--ok-soft); color: var(--ok);
  }
  .hero.changed .icon { background: var(--accent-soft); color: var(--accent); }
  .hero.error   .icon { background: var(--error-soft); color: var(--error); }
  .hero .icon svg { width: 22px; height: 22px; }
  .hero.changed .icon, .hero.error .icon { animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--accent-soft); }
    70%  { box-shadow: 0 0 0 12px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }
  .hero .title { font-size: 19px; font-weight: 650; }
  .hero .desc { color: var(--muted); font-size: 13.5px; margin-top: 3px; }

  /* ---------- meta chips ---------- */
  .meta { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 16px 0 4px; }
  .chipm {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 13px; font-size: 12.5px; color: var(--muted); box-shadow: var(--shadow);
  }
  .chipm b { color: var(--text); font-weight: 600; }

  .notice {
    display: none; margin: 14px 0 0; padding: 10px 14px; border-radius: 10px;
    background: var(--error-soft); color: var(--error); font-size: 13.5px;
  }

  /* ---------- sections ---------- */
  h2 { font-size: 15px; margin: 32px 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--accent); }

  .group-head {
    display: flex; align-items: center; gap: 8px;
    margin: 20px 2px 10px; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .group-head:first-child { margin-top: 4px; }
  .g-count {
    background: var(--chip); color: var(--faint); border-radius: 999px;
    padding: 0 9px; font-size: 11.5px; font-weight: 600; line-height: 18px;
  }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
  .card .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card .head .title { font-size: 15.5px; font-weight: 600; }
  .badge {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 3px 11px;
    border-radius: 999px; white-space: nowrap;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.changed { background: var(--accent-soft); color: var(--accent); }
  .badge.error { background: var(--error-soft); color: var(--error); }
  .card .ver { color: var(--muted); font-size: 13px; margin-top: 7px; }
  .card .errbox {
    margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px;
    background: var(--error-soft); color: var(--error); word-break: break-all;
  }
  .bar { display: flex; gap: 3px; margin-top: 14px; }
  .bar .seg {
    flex: 1 1 0; min-width: 4px; height: 26px; border-radius: 4px;
    background: var(--chip); transition: transform .12s ease, opacity .12s ease;
  }
  .bar .seg.ok { background: var(--ok); opacity: .72; }
  .bar .seg.ok:hover { opacity: 1; transform: scaleY(1.12); }
  .bar .seg.changed { background: var(--accent); }
  .bar .seg.changed:hover, .bar .seg.error:hover { transform: scaleY(1.12); }
  .bar .seg.error { background: var(--error); }
  .bar-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 7px; }
  .bar-foot > span { color: var(--faint); font-size: 12px; }
  .legend { display: inline-flex; gap: 14px; }
  .lg { display: inline-flex; align-items: center; gap: 5px; color: var(--faint); font-size: 12px; }
  .lg-dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
  .lg-dot.ok { background: var(--ok); }
  .lg-dot.changed { background: var(--accent); }
  .lg-dot.error { background: var(--error); }
  .latest { margin-top: 13px; font-size: 13.5px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .latest .muted { color: var(--muted); }
  button.link {
    background: none; border: 1px solid var(--border); color: var(--accent);
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button.link:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* ---------- timeline ---------- */
  .timeline-item {
    display: flex; gap: 12px; align-items: baseline; padding: 12px 10px;
    border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 10px;
    transition: background .13s ease;
  }
  .timeline-item:hover { background: var(--card); }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-item .t-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none;
    position: relative; top: -1px; box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .timeline-item .t-body { flex: 1; min-width: 0; }
  .timeline-item .t-title { font-size: 14px; }
  .timeline-item .t-title .doc { color: var(--muted); font-size: 12.5px; margin-right: 8px; }
  .timeline-item .t-time { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 16px 6px; }

  /* ---------- modal ---------- */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(6,10,20,.55);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    z-index: 40; padding: 24px;
  }
  .overlay.open { display: flex; align-items: flex-start; justify-content: center; }
  .dialog {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    max-width: 880px; width: 100%; max-height: calc(100vh - 48px); overflow: auto;
    padding: 24px 28px; box-shadow: var(--shadow-lg);
    animation: rise .18s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .dialog .d-close {
    float: right; width: 30px; height: 30px; border-radius: 50%;
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-size: 15px; cursor: pointer; line-height: 1; transition: background .15s, color .15s;
  }
  .dialog .d-close:hover { background: var(--chip); color: var(--text); }
  .dialog h3 { margin: 2px 44px 2px 0; font-size: 17px; }
  .dialog .d-sub { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 11px; font-size: 12px; color: var(--text); }
  .chip b { color: var(--accent); }
  .truncated {
    margin: 10px 0; padding: 8px 12px; border-radius: 8px; font-size: 12.5px;
    background: var(--error-soft); color: var(--error);
  }
  .page-sec { margin-top: 18px; border-top: 1px dashed var(--border); padding-top: 13px; }
  .page-sec .p-head { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .page-sec .p-head .chip { margin-left: 8px; }
  .pre {
    font: 12.5px/1.6 ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    margin: 8px 0; color: var(--text);
  }
  .pre .add { color: var(--ok); }
  .pre .del { color: var(--error); }
  .pre .hunk { color: var(--faint); }
  .cellchange { margin: 8px 0; font-size: 13.5px; }
  .cellchange .where { color: var(--muted); font-size: 12.5px; }
  .cellchange .old { background: var(--error-soft); color: var(--error); border-radius: 4px; padding: 1px 7px; text-decoration: line-through; }
  .cellchange .new { background: var(--ok-soft); color: var(--ok); border-radius: 4px; padding: 1px 7px; }
  .dialog .d-foot { margin-top: 20px; font-size: 13px; color: var(--muted); }

  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--faint); font-size: 12.5px; text-align: center; }

  @media (max-width: 640px) {
    .wrap { padding: 22px 14px 48px; }
    .head-row { flex-direction: column; }
    .head-right { flex-direction: row; align-items: center; }
    h1 { font-size: 18px; }
    .hero { padding: 16px; }
    .chipm { padding: 3px 10px; }
    .bar .seg { min-width: 3px; }
    .dialog { padding: 18px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <h1 data-i18n="pageTitle">官方文档更新监控</h1>
        <div class="sub" data-i18n="pageSubtitle">监控 CUHK CDMP 发布的官方 PDF，区分「文件被替换」与「内容真实变化」</div>
      </div>
      <div class="head-right">
        <div class="lang-switch" role="group" aria-label="Language / 語言">
          <button type="button" data-lang="zh-CN" class="active">简</button>
          <button type="button" data-lang="zh-TW">繁</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <span class="refresh" id="refreshState"></span>
      </div>
    </div>
  </header>

  <div class="hero" id="hero">
    <div class="icon loading" id="heroIcon"></div>
    <div class="hero-body">
      <div class="title" id="heroTitle">加载中…</div>
      <div class="desc" id="heroDesc"></div>
    </div>
  </div>

  <div class="meta" id="meta"></div>
  <div class="notice" id="notice"></div>

  <h2 data-i18n="sectionDocs">监控文档</h2>
  <div id="docs"></div>

  <h2 data-i18n="sectionTimeline">变更时间线</h2>
  <div id="timeline"></div>

  <footer data-i18n="footer">本页面只读展示监控结果，不会触发新的检查 · 时间均为本地时区</footer>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" id="dialog"></div>
</div>

};

var currentLang = "zh-CN";
var lastData = null;
var lastSuccessAt = null;

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function t(key, params) {
  var text = I18N[currentLang] && I18N[currentLang][key];
  if (text == null) text = I18N["zh-CN"][key];
  if (text == null) text = key;
  if (params) {
    for (var p in params) {
      if (Object.prototype.hasOwnProperty.call(params, p)) {
        text = text.split("{" + p + "}").join(String(params[p]));
      }
    }
  }
  return text;
}
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtAbs(iso) {
  if (!iso) return "—";
  var d = new Date(iso);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
    " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function relTime(iso, now) {
  if (!iso) return "—";
  var diff = (new Date(iso).getTime() - (now || Date.now())) / 1000;
  var future = diff > 0;
  diff = Math.abs(diff);
  var units = I18N[currentLang].units;
  var value, unit;
  if (diff < 60) { value = Math.round(diff); unit = units[0]; }
  else if (diff < 3600) { value = Math.round(diff / 60); unit = units[1]; }
  else if (diff < 86400) { value = Math.round(diff / 3600); unit = units[2]; }
  else if (diff < 86400 * 30) { value = Math.round(diff / 86400); unit = units[3]; }
  else return fmtAbs(iso);
  if (currentLang === "en") {
    return future ? "in " + value + " " + unit : value + " " + unit + " ago";
  }
  return value + " " + unit + (future ? t("suffixFuture") : t("suffixPast"));
}
function fmtBytes(n) {
  if (n == null) return "—";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n >= 1024) return Math.round(n / 1024) + " KB";
  return n + " B";
}
function fmtDuration(ms) {
  if (ms == null) return "—";
  if (ms >= 1000) return (ms / 1000).toFixed(1) + " s";
  return ms + " ms";
}
function fmtInterval(minutes) {
  if (minutes == null) return "—";
  var sg = currentLang === "en";
  var units = sg ? I18N.en.ivUnitsSg : I18N[currentLang].ivUnits;
  if (minutes % 1440 === 0) {
    var d = minutes / 1440;
    return sg && d === 1 ? "1 day" : d + " " + units[0];
  }
  if (minutes % 60 === 0) {
    var h = minutes / 60;
    return sg && h === 1 ? "1 hour" : h + " " + units[1];
  }
  return minutes + " " + units[2];
}
function segClass(outcome) {
  if (outcome === "content_changed") return "changed";
  if (outcome === "error") return "error";
  return "ok";
}
function detectLang() {
  var saved = null;
  try { saved = window.localStorage.getItem(LANG_KEY); } catch (e) { saved = null; }
  if (saved && I18N[saved]) return saved;
  var langs = (navigator.languages && navigator.languages.length)
    ? navigator.languages
    : [navigator.language || "zh-CN"];
  for (var i = 0; i < langs.length; i++) {
    var l = String(langs[i] || "").toLowerCase();
    if (l.indexOf("zh") === 0) {
      if (l.indexOf("hant") >= 0 || l.indexOf("-tw") >= 0 || l.indexOf("-hk") >= 0 || l.indexOf("-mo") >= 0) {
        return "zh-TW";
      }
      return "zh-CN";
    }
    if (l.indexOf("en") === 0) return "en";
  }
  return "zh-CN";
}
function applyStaticLang() {
  document.documentElement.lang = currentLang;
  document.title = t("pageTitle");
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
  }
  var buttons = document.querySelectorAll(".lang-switch button");
  for (var j = 0; j < buttons.length; j++) {
    buttons[j].classList.toggle("active", buttons[j].getAttribute("data-lang") === currentLang);
  }
}
function setLang(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  try { window.localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  applyStaticLang();
  if (!lastData) {
    $("heroTitle").textContent = t("loading");
    $("heroDesc").textContent = "";
    $("heroIcon").innerHTML = ICONS.loading;
    $("hero").className = "hero";
    $("meta").innerHTML = "";
  } else {
    renderHero(lastData);
    renderMeta(lastData);
    renderDocs(lastData);
    renderTimeline(lastData);
  }
  renderRefreshState();
}

function renderHero(data) {
  var docs = data.documents || [];
  var hero = $("hero");
  var title = $("heroTitle"), desc = $("heroDesc"), icon = $("heroIcon");

  if (!docs.length) {
    hero.className = "hero";
    icon.innerHTML = ICONS.loading;
    title.textContent = t("noDocs");
    desc.textContent = t("noDocsDesc");
    return;
  }
  var failing = docs.filter(function (d) { return d.monitor.consecutive_failures > 0; });
  var withChange = docs.filter(function (d) { return d.latest_change; });
  if (failing.length) {
    hero.className = "hero error";
    icon.innerHTML = ICONS.error;
    title.textContent = t("heroError");
    desc.textContent = failing.map(function (d) {
      return t("heroErrorItem", { doc: d.title, n: d.monitor.consecutive_failures });
    }).join(t("heroErrorJoin"));
    return;
  }
  if (withChange.length) {
    var latest = withChange.slice().sort(function (a, b) {
      return new Date(b.latest_change.detected_at) - new Date(a.latest_change.detected_at);
    })[0];
    hero.className = "hero changed";
    icon.innerHTML = ICONS.changed;
    title.textContent = t("heroChanged");
    desc.textContent = t("heroChangedDesc", {
      time: relTime(latest.latest_change.detected_at),
      doc: latest.title,
      n: withChange.length
    });
    return;
  }
  hero.className = "hero";
  icon.innerHTML = ICONS.ok;
  title.textContent = t("heroOk");
  desc.textContent = t("heroOkDesc", { n: docs.length });
}

function renderMeta(data) {
  var docs = data.documents || [];
  var lastChecked = null;
  docs.forEach(function (d) {
    var ts = d.monitor.last_checked_at;
    if (ts && (!lastChecked || ts > lastChecked)) lastChecked = ts;
  });
  var s = data.scheduler || {};
  var next = s.enabled
    ? (s.next_run_at ? t("nextScheduled", { time: relTime(s.next_run_at) }) : t("nextWaiting"))
    : t("schedOff");
  function chip(label, value) {
    return '<span class="chipm"><span>' + esc(label) + '</span><b>' + esc(value) + "</b></span>";
  }
  var changedCount = docs.filter(function (d) { return d.latest_change; }).length;
  var failedCount = docs.filter(function (d) { return d.monitor.consecutive_failures > 0; }).length;
  $("meta").innerHTML =
    chip(t("statsDocs", { n: docs.length }),
         t("statsChanged", { n: changedCount }) + " · " + t("statsFailed", { n: failedCount })) +
    chip(t("metaLastCheck"), lastChecked ? relTime(lastChecked) : t("notYet")) +
    chip(t("metaNextCheck"), next) +
    chip(t("metaInterval"), fmtInterval(s.interval_minutes)) +
    chip(t("metaGenerated"), fmtAbs(data.generated_at));
}

function legendItem(cls, label) {
  return '<span class="lg"><i class="lg-dot ' + cls + '"></i>' + esc(label) + "</span>";
}

// 卡片按文档第一个 tag 分组（documents.yaml 约定：首个 tag 为显示类别）。
var GROUP_ORDER = ["equivalence-cuhk", "equivalence-sz", "u-core", "other"];
function groupOf(doc) {
  var tags = doc.tags || [];
  for (var i = 0; i < GROUP_ORDER.length - 1; i++) {
    if (tags.indexOf(GROUP_ORDER[i]) >= 0) return GROUP_ORDER[i];
  }
  return "other";
}

function renderDocCard(d) {
  var failing = d.monitor.consecutive_failures > 0;
  var changed = !!d.latest_change;
  var badgeClass = failing ? "error" : (changed ? "changed" : "ok");
  var badgeLabel = failing ? t("badgeError") : (changed ? t("badgeChanged") : t("badgeOk"));

  var errbox = failing && d.monitor.last_error
    ? '<div class="errbox">' + esc(d.monitor.last_error) + "</div>" : "";

  var v = d.current_version;
  var ver = v
    ? t("currentVersion", {
        time: fmtAbs(v.fetched_at), pages: v.page_count,
        size: fmtBytes(v.size_bytes), sha: String(v.sha256 || "").slice(0, 8)
      })
    : t("notFetched");

  var checks = d.checks || [];
  var bar, foot;
  if (checks.length) {
    bar = '<div class="bar">' + checks.map(function (c) {
      var tip = fmtAbs(c.checked_at) + " · " + t("outcome_" + c.outcome) +
        " · HTTP " + (c.http_status == null ? "—" : c.http_status) +
        " · " + fmtDuration(c.duration_ms);
      return '<div class="seg ' + segClass(c.outcome) + '" title="' + esc(tip) + '"></div>';
    }).join("") + "</div>";
    foot = '<div class="bar-foot"><span>' + esc(t("checksBarCount", { n: checks.length })) + "</span>" +
      '<span class="legend">' +
      legendItem("ok", t("legendOk")) +
      legendItem("changed", t("legendChanged")) +
      legendItem("error", t("legendError")) +
      "</span></div>";
  } else {
    bar = "";
    foot = '<div class="bar-foot"><span>' + esc(t("checksEmpty")) + "</span></div>";
  }

  var latest;
  if (d.latest_change) {
    latest = '<div class="latest">' + esc(t("latestPrefix")) + "<b>" +
      esc(relTime(d.latest_change.detected_at)) + "</b> · " + esc(d.latest_change.headline) +
      ' <button type="button" class="link" onclick="openDetail(' + d.latest_change.id + ')">' +
      esc(t("viewReport")) + "</button></div>";
  } else {
    latest = '<div class="latest muted">' + esc(t("baselineNoChange")) + "</div>";
  }

  return '<div class="card">' +
    '<div class="head"><span class="title"><a href="' + esc(d.url) + '" target="_blank" rel="noopener">' +
    esc(d.title) + "</a></span>" +
    '<span class="badge ' + badgeClass + '">' + esc(badgeLabel) + "</span></div>" +
    '<div class="ver">' + esc(ver) + "</div>" + errbox + bar + foot + latest +
    "</div>";
}

function renderDocs(data) {
  var host = $("docs");
  var docs = data.documents || [];
  var buckets = {};
  GROUP_ORDER.forEach(function (g) { buckets[g] = []; });
  docs.forEach(function (d) { buckets[groupOf(d)].push(d); });
  var html = "";
  GROUP_ORDER.forEach(function (g) {
    var items = buckets[g];
    if (!items.length) return;
    items = items.slice().sort(function (a, b) {
      return a.title.localeCompare(b.title, currentLang === "en" ? "en" : "zh-Hans-CN");
    });
    html += '<div class="group-head"><span>' + esc(t("group_" + g.replace(/-/g, "_"))) + "</span>" +
      '<span class="g-count">' + items.length + "</span></div>" +
      items.map(renderDocCard).join("");
  });
  host.innerHTML = html;
}

function renderTimeline(data) {
  var host = $("timeline");
  var items = data.recent_changes || [];
  if (!items.length) {
    host.innerHTML = '<div class="empty">' + esc(t("timelineEmpty")) + "</div>";
    return;
  }
  host.innerHTML = items.map(function (c) {
    return '<div class="timeline-item" onclick="openDetail(' + c.id + ')">' +
      '<span class="t-dot"></span>' +
      '<div class="t-body"><div class="t-title"><span class="doc">' + esc(c.document_title) + "</span>" +
      esc(c.headline) + "</div></div>" +
      '<div class="t-time">' + esc(fmtAbs(c.detected_at)) + " · " + esc(relTime(c.detected_at)) + "</div>" +
      "</div>";
  }).join("");
}

function renderSummaryChips(summary) {
  var chips = SUMMARY_KEYS.filter(function (pair) { return (summary[pair[0]] || 0) > 0; })
    .map(function (pair) {
      return '<span class="chip">' + esc(t(pair[1])) + " <b>" + summary[pair[0]] + "</b></span>";
    });
  return chips.length ? '<div class="chips">' + chips.join("") + "</div>" : "";
}

function renderLineChanges(page) {
  var html = "";
  (page.line_changes || []).forEach(function (ch) {
    (ch.old_lines || []).forEach(function (line) {
      html += '<span class="del">- ' + esc(line) + "</span>\n";
    });
    (ch.new_lines || []).forEach(function (line) {
      html += '<span class="add">+ ' + esc(line) + "</span>\n";
    });
  });
  return html ? '<div class="pre">' + html + "</div>" : "";
}

function renderTableChanges(page) {
  var html = "";
  (page.table_changes || []).forEach(function (tc) {
    var where = t("detailTable", { n: tc.table_index == null ? 1 : tc.table_index + 1 });
    if (tc.type === "cell_modified") {
      html += '<div class="cellchange"><span class="where">' + esc(where) + " · " +
        esc(t("detailRowCol", {
          row: tc.old_row == null ? "?" : tc.old_row + 1,
          col: tc.column == null ? "?" : tc.column + 1
        })) + "</span>" +
        '<span class="old">' + esc(tc.old) + '</span> → <span class="new">' + esc(tc.new) + "</span>" +
        (tc.row_context ? '<div class="pre">' + esc(tc.row_context) + "</div>" : "") +
        "</div>";
    } else if (tc.type === "cell_added" || tc.type === "cell_removed") {
      html += '<div class="cellchange"><span class="where">' + esc(where) + " · " +
        esc(t(tc.type === "cell_added" ? "cellAdded" : "cellRemoved")) + "</span>" +
        '<span class="' + (tc.type === "cell_added" ? "new" : "old") + '">' +
        esc(tc.new != null ? tc.new : tc.old) + "</span>" +
        (tc.row_context ? '<div class="pre">' + esc(tc.row_context) + "</div>" : "") +
        "</div>";
    } else if (tc.type === "row_added" || tc.type === "row_removed") {
      html += '<div class="cellchange"><span class="where">' + esc(where) + " · " +
        esc(t(tc.type === "row_added" ? "rowAdded" : "rowRemoved")) + "</span>" +
        (tc.row_context ? '<div class="pre">' + esc(tc.row_context) + "</div>" : "") + "</div>";
    } else if (tc.type === "table_added" || tc.type === "table_removed") {
      html += '<div class="cellchange"><span class="where">' + esc(where) + " · " +
        esc(t(tc.type === "table_added" ? "tableAdded" : "tableRemoved")) + "</span></div>";
    }
  });
  return html;
}

function renderUnifiedDiff(text) {
  if (!text) return "";
  var html = text.split("\n").map(function (line) {
    var cls = "";
    if (line.charAt(0) === "+") cls = "add";
    else if (line.charAt(0) === "-") cls = "del";
    else if (line.indexOf("@@") === 0) cls = "hunk";
    return cls ? '<span class="' + cls + '">' + esc(line) + "</span>" : esc(line);
  }).join("\n");
  return '<div class="pre">' + html + "</div>";
}

function renderDetail(detail) {
  var pages = (detail.diff && detail.diff.pages) || [];
  var html = '<button type="button" class="d-close" onclick="closeDetail()" title="' +
    esc(t("close")) + '">✕</button>' +
    "<h3>" + esc(detail.headline) + "</h3>" +
    '<div class="d-sub">' + esc(detail.document_title) + " · " + esc(t("detailDetectedAt")) + " " +
    esc(fmtAbs(detail.detected_at)) + "（" + esc(relTime(detail.detected_at)) + "）</div>" +
    renderSummaryChips(detail.summary || {});
  if (detail.truncated) {
    html += '<div class="truncated">' + esc(t("truncated")) + "</div>";
  }
  pages.forEach(function (p) {
    var pageNo = p.new_page != null ? p.new_page : p.old_page;
    html += '<div class="page-sec"><div class="p-head">' + esc(t("detailPage", { n: pageNo })) +
      '<span class="chip">' + esc(t("page_" + p.status)) + "</span></div>" +
      renderTableChanges(p) + renderLineChanges(p) + "</div>";
  });
  if (detail.unified_diff) {
    html += '<div class="page-sec"><div class="p-head">' + esc(t("unifiedDiff")) + "</div>" +
      renderUnifiedDiff(detail.unified_diff) + "</div>";
  }
  html += '<div class="d-foot"><a href="' + esc(detail.markdown_url) + '" target="_blank" rel="noopener">' +
    esc(t("fullReport")) + "</a></div>";
  return html;
}

function openDetail(changeId) {
  fetch("/updates/changes/" + changeId, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (detail) {
      $("dialog").innerHTML = renderDetail(detail);
      $("overlay").classList.add("open");
      $("dialog").scrollTop = 0;
    })
    .catch(function (err) {
      $("dialog").innerHTML =
        '<button type="button" class="d-close" onclick="closeDetail()" title="' +
        esc(t("close")) + '">✕</button>' +
        "<h3>" + esc(t("modalLoadFailed")) + "</h3>" +
        '<div class="d-sub">' + esc(t("modalLoadFailedDesc", { msg: err.message })) + "</div>";
      $("overlay").classList.add("open");
    });
}
function closeDetail() { $("overlay").classList.remove("open"); }
$("overlay").addEventListener("click", function (e) {
  if (e.target === $("overlay")) closeDetail();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeDetail();
});

var refreshTimer = null;

// 自动刷新对齐检查间隔：数据只在检查后才可能变化，无需高频轮询。
// 间隔缺省时取上限；失败重试固定 60 秒。回到可见标签页时立即刷新（见 visibilitychange）。
function scheduleRefresh(intervalMinutes) {
  if (refreshTimer !== null) clearTimeout(refreshTimer);
  var ms = (intervalMinutes || 0) * 60000 || REFRESH_MAX_MS;
  ms = Math.max(REFRESH_MIN_MS, Math.min(ms, REFRESH_MAX_MS));
  refreshTimer = setTimeout(loadData, ms);
}

function loadData() {
  fetch("/updates/data.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      lastData = data;
      lastSuccessAt = Date.now();
      $("notice").style.display = "none";
      renderHero(data);
      renderMeta(data);
      renderDocs(data);
      renderTimeline(data);
      scheduleRefresh(data.scheduler && data.scheduler.interval_minutes);
    })
    .catch(function () {
      var box = $("notice");
      box.style.display = "block";
      box.textContent = t("loadFailed", {
        extra: lastSuccessAt ? t("lastSuccess", { time: relTime(new Date(lastSuccessAt).toISOString()) }) : ""
      });
      scheduleRefresh(RETRY_MINUTES);
    });
}
function renderRefreshState() {
  if (!lastSuccessAt) return;
  $("refreshState").textContent = t("refreshOk", { time: relTime(new Date(lastSuccessAt).toISOString()) });
}
window.openDetail = openDetail;
window.closeDetail = closeDetail;

(function boot() {
  var buttons = document.querySelectorAll(".lang-switch button");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener("click", function () {
      setLang(this.getAttribute("data-lang"));
    });
  }
  currentLang = detectLang();
  setLang(currentLang);
  loadData();
})();
setInterval(renderRefreshState, 5000);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) loadData();
});
</script>
</body>
</html>
