services:
  monitor:
    build: .
    container_name: cdmp-pdf-monitor
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DOCUMENTS_CONFIG: /app/config/documents.yaml
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - monitor_data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  monitor_data:
