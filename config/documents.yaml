# Registry of monitored official PDFs.
#
# Convention: the FIRST tag is the display category the /updates page groups
# cards by. Supported categories: equivalence-cuhk, equivalence-sz, u-core,
# other. Keep the first tag within that set.
#
# Cohort coverage notes:
# - sea-course-list (no suffix) is the 2025-26 file; it predates the
#   cohort-suffixed keys and keeps its history under the original key.
# - The two SZ equivalence lists each cover two cohorts; one file = one entry.
# - u-core-cuhk-cuhksz is the "2024-25 and thereafter" file.

